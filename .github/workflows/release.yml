name: Build and release

# Tag a commit (git tag v1.1.0 && git push --tags) and this builds the portable exe
# and publishes it as a release asset. The app's updater looks for exactly that asset.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Falling back to a placeholder here would ship a binary stamped older than the tag,
          # and every client would download it forever without the version ever changing.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' is not vMAJOR.MINOR.PATCH — refusing to build a mis-stamped release."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/LexusWarKey.Tests --nologo -v minimal

      - name: Publish portable exe
        run: >
          dotnet publish src/LexusWarKey -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o publish

      # v2.6.5 ба өмнөх updater-ууд "LexusWarKey.exe" нэртэй asset хайдаг тул ижил exe-г
      # хуучин нэрээр давхар нийтэлнэ (байт ижил тул SHA256 нэг). Хэрэглэгчид v2.6.6+ дээр
      # гарсны дараа legacy хуулбарыг хасаж болно.
      - name: Legacy asset copy
        shell: pwsh
        run: Copy-Item publish/GarenaWarKey.exe publish/LexusWarKey.exe

      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/GarenaWarKey.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Tee-Object -FilePath publish/SHA256.txt
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # The hash goes in the release BODY, not just the asset. The updater reads the body from
      # api.github.com while the exe comes from the release CDN, so tampering with the download
      # alone is not enough to pass verification — the two would have to be compromised together.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Garena.mn WarKey ${{ github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            SHA256: ${{ steps.checksum.outputs.sha256 }}
          files: |
            publish/GarenaWarKey.exe
            publish/LexusWarKey.exe
            publish/SHA256.txt
